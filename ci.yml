name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint with flake8
        run: |
          flake8 secretscope tests --max-line-length=120 --extend-ignore=E203,W503

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

      - name: Self-scan (demo run against example vulnerable file)
        run: |
          python -m secretscope.cli examples/vulnerable_sample.py --output console --fail-on-findings || true
